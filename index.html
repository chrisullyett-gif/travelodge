<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travelodge Sheffield Parts Depot Portal</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase App (Core) SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <!-- Firebase Database SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <!-- Lucide Icons Library -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Canvas Confetti for Shift Completion -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --tl-navy: #002D62;
            --tl-red: #E31B23;
            --tl-light-blue: #4BACE3; 
            
            --bg-color: #f0f2f5;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --success-color: #10b981;
            --warning-color: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', system-ui, -apple-system, sans-serif;
        }

        body {
            background: radial-gradient(circle at top left, #ffffff, var(--bg-color));
            color: var(--text-main);
            padding-bottom: 60px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(135deg, var(--tl-navy), #001a3a);
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 45, 98, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-logo {
            height: 32px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.2));
        }

        .header-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .header-btn:hover {
            background: var(--tl-light-blue);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(75, 172, 227, 0.4);
        }

        .container {
            max-width: 600px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .screen {
            display: none;
            animation: fadeSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .active-screen {
            display: block;
        }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255,255,255,0.6);
            backdrop-filter: blur(10px);
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--tl-navy);
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        h3 {
            font-size: 17px;
            font-weight: 600;
            color: var(--tl-navy);
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--tl-light-blue);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        select, input[type="text"], input[type="number"], input[type="time"], input[type="password"], textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            background: #fff;
            color: var(--text-main);
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: var(--tl-light-blue);
            box-shadow: 0 0 0 4px rgba(75, 172, 227, 0.15);
            transform: translateY(-1px);
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-top: 12px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .btn:active { transform: scale(0.97); }

        .btn-primary {
            background: linear-gradient(135deg, var(--tl-light-blue), #3a9bd0);
            color: white;
            box-shadow: 0 4px 15px rgba(75, 172, 227, 0.3);
        }
        .btn-primary:hover { 
            background: linear-gradient(135deg, #3a9bd0, #2c8bc0);
            box-shadow: 0 6px 20px rgba(75, 172, 227, 0.4);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--tl-red), #c5141b);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success-color), #059669);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-secondary {
            background-color: #f3f4f6;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover { background-color: #e5e7eb; }

        .home-menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 24px;
        }

        .split-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            border: 2px solid transparent;
        }

        .split-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(75, 172, 227, 0.2);
            border-color: var(--tl-light-blue);
        }

        .split-card-top {
            background: linear-gradient(135deg, var(--tl-navy), #001a3a);
            padding: 32px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            min-height: 120px;
        }

        .split-card-top svg {
            width: 44px;
            height: 44px;
            stroke: var(--tl-light-blue);
            stroke-width: 2;
            transition: transform 0.3s ease;
        }

        .split-card:hover .split-card-top svg {
            transform: scale(1.1) rotate(5deg);
        }

        .split-card-bottom {
            background-color: white;
            color: var(--tl-navy);
            padding: 16px 10px;
            text-align: center;
            font-size: 15px;
            font-weight: 700;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 8px;
        }

        .eng-checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .eng-checkbox-label:hover {
            border-color: var(--tl-light-blue);

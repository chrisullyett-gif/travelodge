<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travelodge Sheffield Parts Hub Portal</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    :root {
      --primary-navy: #002D62;
      --travelodge-blue: #00539F;
      --accent-red: #E31B23;
      --bg-light: #F4F6F9;
      --card-bg: #FFFFFF;
      --text-main: #333333;
      --border-color: #DCDCDC;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-light); color: var(--text-main); padding-bottom: 40px; }
    
    /* Header Styles */
    .app-header { background-color: var(--primary-navy); color: white; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 4px solid var(--accent-red); position: relative; }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .home-btn { background: rgba(255,255,255,0.15); border: none; color: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .home-btn:hover { background: rgba(255,255,255,0.25); }
    .brand-title-area { display: flex; align-items: center; gap: 10px; }
    
    /* Notification Bell */
    .notification-wrapper { position: relative; cursor: pointer; background: rgba(255,255,255,0.1); padding: 8px; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
    .notification-wrapper:hover { background: rgba(255,255,255,0.2); }
    .notification-badge { position: absolute; top: 4px; right: 4px; background: var(--accent-red); color: white; font-size: 10px; font-weight: bold; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    
    /* Notification Modal / Dropdown */
    #notification-modal { display: none; position: absolute; right: 20px; top: 65px; width: 300px; background: white; color: #333; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000; padding: 15px; border-top: 3px solid var(--travelodge-blue); }
    #notification-modal h4 { margin-bottom: 8px; font-size: 15px; color: var(--primary-navy); display: flex; justify-content: space-between; align-items: center; }
    #notification-modal p { font-size: 13px; color: #666; line-height: 1.4; }

    /* Main Container */
    .container { max-width: 750px; margin: 20px auto; background: var(--card-bg); padding: 25px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    h2 { color: var(--primary-navy); margin-bottom: 20px; font-size: 22px; border-bottom: 2px solid var(--bg-light); padding-bottom: 10px; }
    
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; font-size: 12px; text-transform: uppercase; color: #555; margin-bottom: 6px; letter-spacing: 0.5px; }
    select, input[type="text"], textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px; background: #fff; }
    select:focus, input:focus, textarea:focus { outline: none; border-color: var(--travelodge-blue); box-shadow: 0 0 0 3px rgba(0,83,159,0.1); }
    
    .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #fafafa; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; }
    .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: #333; cursor: pointer; text-transform: none; margin: 0; }
    .checkbox-label input { width: 16px; height: 16px; accent-color: var(--travelodge-blue); cursor: pointer; }

    .btn { background-color: var(--travelodge-blue); color: white; border: none; padding: 12px 20px; font-size: 15px; font-weight: 600; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.2s; }
    .btn:hover { background-color: #003f75; }
    .btn-secondary { background-color: #555; margin-top: 10px; }
    .btn-secondary:hover { background-color: #333; }

    /* Manifest List Section */
    .manifest-card { background: #fff; border: 1px solid var(--border-color); border-left: 5px solid var(--travelodge-blue); border-radius: 6px; padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .manifest-info h5 { font-size: 16px; color: var(--primary-navy); margin-bottom: 4px; }
    .manifest-info p { font-size: 13px; color: #666; margin-bottom: 2px; }
    .manifest-actions { display: flex; gap: 8px; }
    .action-btn { padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
    .btn-maps { background: #107c41; color: white; }
    .btn-delete { background: #d83b01; color: white; }

    /* Modal / Popup for Proof Photos */
    #photo-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 20px; border-radius: 8px; max-width: 500px; width: 90%; text-align: center; }
    .modal-content img { max-width: 100%; max-height: 350px; border-radius: 4px; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- Header with Travelodge Branding & Interactive Notification Bell -->
  <header class="app-header">
    <div class="header-left">
      <button class="home-btn" onclick="resetToHome()">
        🏠 Home
      </button>
      <div class="brand-title-area">
        <!-- Travelodge Stylized Horizon Logo SVG -->
        <svg width="36" height="28" viewBox="0 0 100 80" style="border-radius: 4px;">
          <defs>
            <linearGradient id="h_sunset" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#E31B23" />
              <stop offset="100%" stop-color="#FF6B6B" />
            </linearGradient>
            <linearGradient id="h_bed" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00539F" />
              <stop offset="100%" stop-color="#002D62" />
            </linearGradient>
          </defs>
          <rect width="100" height="80" fill="url(#h_sunset)" rx="10"/>
          <path d="M0 65 C 30 55, 60 70, 100 50 L 100 80 L 0 80 Z" fill="url(#h_bed)"/>
          <path d="M30 42 Q 35 45 42 42 Q 45 40 43 37" stroke="#E0F7FA" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </svg>
        <span style="font-size: 18px; font-weight: 700; letter-spacing: -0.3px;">Sheffield Depot</span>
      </div>
    </div>

    <!-- Interactive Notification Bell -->
    <div class="notification-wrapper" onclick="toggleNotificationModal()" title="View Notifications">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="notification-badge" id="notif-count">1</span>
    </div>

    <!-- Notification Dropdown Modal -->
    <div id="notification-modal">
      <h4>System Notifications <span style="cursor: pointer; font-size: 12px; color: var(--travelodge-blue);" onclick="toggleNotificationModal()">✕ Close</span></h4>
      <p id="notif-text"><strong>Sync Active:</strong> Connected to Sheffield Parts Hub database. 0 active delivery manifests queued for today.</p>
    </div>
  </header>

  <!-- Main Portal Container -->
  <div class="container" id="app-container">
    <h2>Build Daily Route Manifest</h2>
    
    <div class="form-group">
      <label>Start Hub Depot</label>
      <select id="startDepot">
        <option value="Revill Road Langold">Revill Road Langold</option>
        <option value="Sheffield Parts Hub">Sheffield Parts Hub</option>
      </select>
    </div>

    <div class="form-group">
      <label>End Destination Hub</label>
      <select id="endDepot">
        <option value="Revill Road Langold">Revill Road Langold</option>
        <option value="Sheffield Parts Hub">Sheffield Parts Hub</option>
      </select>
    </div>

    <div class="form-group">
      <label>Search Travelodge Hotel</label>
      <input type="text" id="hotelSearch" placeholder="Type hotel name (e.g., Sheffield, Leeds)..." oninput="filterHotels()">
    </div>

    <div class="form-group">
      <label>Select Hotel Destination</label>
      <select id="hotelSelect">
        <option value="Travelodge Sheffield Central">Travelodge Sheffield Central</option>
        <option value="Travelodge Sheffield Meadowhall">Travelodge Sheffield Meadowhall</option>
        <option value="Travelodge Leeds Central">Travelodge Leeds Central</option>
        <option value="Travelodge Chesterfield">Travelodge Chesterfield</option>
        <option value="Travelodge Doncaster">Travelodge Doncaster</option>
        <option value="Travelodge Nottingham Embankment">Travelodge Nottingham Embankment</option>
      </select>
    </div>

    <div class="form-group">
      <label>Assign Engineers (Check All Applicable)</label>
      <div class="checkbox-grid">
        <label class="checkbox-label"><input type="checkbox" name="engineer" value="MARK"> MARK</label>
        <label class="checkbox-label"><input type="checkbox" name="engineer" value="STEVE"> STEVE</label>
        <label class="checkbox-label"><input type="checkbox" name="engineer" value="PAUL"> PAUL</label>
        <label class="checkbox-label"><input type="checkbox" name="engineer" value="ANDY"> ANDY</label>
      </div>
    </div>

    <div class="form-group">
      <label>Sticker Dot Colour Identifier</label>
      <select id="dotColour">
        <option value="">-- Select Dot Colour --</option>
        <option value="Red">Red</option>
        <option value="Blue">Blue</option>
        <option value="Green">Green</option>
        <option value="Yellow">Yellow</option>
      </select>
    </div>

    <div class="form-group">
      <label>Staging / Packing Notes (Optional)</label>
      <textarea id="packingNotes" rows="3" placeholder="Special parts instructions or bay details..."></textarea>
    </div>

    <button class="btn" onclick="addManifestStop()">Add Stop to Route Manifest</button>
    <button class="btn btn-secondary" onclick="viewCurrentManifest()">View Current Manifest (<span id="manifestCount">0</span>)</button>
  </div>

  <!-- Photo Proof Modal Preview -->
  <div id="photo-modal" onclick="closePhotoModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3>Proof of Delivery Photo</h3>
      <img id="modal-img" src="" alt="Proof Photo">
      <button class="btn btn-secondary" style="margin-top: 15px;" onclick="closePhotoModal()">Close</button>
    </div>
  </div>

  <script>
    // --- Application State & Logic ---
    let routeManifest = JSON.parse(localStorage.getItem('travelodge_manifest') || '[]');
    updateManifestBadge();

    function toggleNotificationModal() {
      const modal = document.getElementById('notification-modal');
      modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
    }

    function resetToHome() {
      document.getElementById('app-container').innerHTML = `
        <h2>Build Daily Route Manifest</h2>
        <div class="form-group">
          <label>Start Hub Depot</label>
          <select id="startDepot"><option value="Revill Road Langold">Revill Road Langold</option><option value="Sheffield Parts Hub">Sheffield Parts Hub</option></select>
        </div>
        <div class="form-group">
          <label>End Destination Hub</label>
          <select id="endDepot"><option value="Revill Road Langold">Revill Road Langold</option><option value="Sheffield Parts Hub">Sheffield Parts Hub</option></select>
        </div>
        <div class="form-group">
          <label>Search Travelodge Hotel</label>
          <input type="text" id="hotelSearch" placeholder="Type hotel name (e.g., Sheffield, Leeds)..." oninput="filterHotels()">
        </div>
        <div class="form-group">
          <label>Select Hotel Destination</label>
          <select id="hotelSelect">
            <option value="Travelodge Sheffield Central">Travelodge Sheffield Central</option>
            <option value="Travelodge Sheffield Meadowhall">Travelodge Sheffield Meadowhall</option>
            <option value="Travelodge Leeds Central">Travelodge Leeds Central</option>
            <option value="Travelodge Chesterfield">Travelodge Chesterfield</option>
            <option value="Travelodge Doncaster">Travelodge Doncaster</option>
            <option value="Travelodge Nottingham Embankment">Travelodge Nottingham Embankment</option>
          </select>
        </div>
        <div class="form-group">
          <label>Assign Engineers (Check All Applicable)</label>
          <div class="checkbox-grid">
            <label class="checkbox-label"><input type="checkbox" name="engineer" value="MARK"> MARK</label>
            <label class="checkbox-label"><input type="checkbox" name="engineer" value="STEVE"> STEVE</label>
            <label class="checkbox-label"><input type="checkbox" name="engineer" value="PAUL"> PAUL</label>
            <label class="checkbox-label"><input type="checkbox" name="engineer" value="ANDY"> ANDY</label>
          </div>
        </div>
        <div class="form-group">
          <label>Sticker Dot Colour Identifier</label>
          <select id="dotColour">
            <option value="">-- Select Dot Colour --</option>
            <option value="Red">Red</option><option value="Blue">Blue</option><option value="Green">Green</option><option value="Yellow">Yellow</option>
          </select>
        </div>
        <div class="form-group">
          <label>Staging / Packing Notes (Optional)</label>
          <textarea id="packingNotes" rows="3" placeholder="Special parts instructions or bay details..."></textarea>
        </div>
        <button class="btn" onclick="addManifestStop()">Add Stop to Route Manifest</button>
        <button class="btn btn-secondary" onclick="viewCurrentManifest()">View Current Manifest (<span id="manifestCount">${routeManifest.length}</span>)</button>
      `;
    }

    function filterHotels() {
      const query = document.getElementById('hotelSearch').value.toLowerCase();
      const select = document.getElementById('hotelSelect');
      for (let i = 0; i < select.options.length; i++) {
        const txt = select.options[i].text.toLowerCase();
        select.options[i].style.display = txt.includes(query) ? '' : 'none';
      }
      // Auto select first visible option if any match
      for (let i = 0; i < select.options.length; i++) {
        if (select.options[i].style.display !== 'none') {
          select.selectedIndex = i;
          break;
        }
      }
    }

    function addManifestStop() {
      const hotel = document.getElementById('hotelSelect').value;
      const dot = document.getElementById('dotColour').value;
      const notes = document.getElementById('packingNotes').value;
      
      const selectedEngs = [];
      document.querySelectorAll('input[name="engineer"]:checked').forEach(cb => selectedEngs.push(cb.value));

      if (!dot) {
        alert('Please select a sticker dot colour identifier.');
        return;
      }

      const stopItem = {
        id: Date.now(),
        hotel: hotel,
        engineers: selectedEngs.join(', ') || 'None assigned',
        dotColour: dot,
        notes: notes || 'None'
      };

      routeManifest.push(stopItem);
      localStorage.setItem('travelodge_manifest', JSON.stringify(routeManifest));
      updateManifestBadge();
      alert('Stop successfully added to manifest!');
      resetToHome();
    }

    function updateManifestBadge() {
      const countEl = document.getElementById('manifestCount');
      if (countEl) countEl.innerText = routeManifest.length;
      const notifText = document.getElementById('notif-text');
      if (notifText) {
        notifText.innerHTML = `<strong>Sync Active:</strong> Connected to database. ${routeManifest.length} active delivery manifests queued for today.`;
      }
    }

    function viewCurrentManifest() {
      let html = `<h2>Current Route Manifest (${routeManifest.length} Stops)</h2>`;
      if (routeManifest.length === 0) {
        html += `<p style="color: #666; margin-bottom: 20px;">No stops added to manifest yet today.</p>`;
      } else {
        routeManifest.forEach((stop, idx) => {
          html += `
            <div class="manifest-card">
              <div class="manifest-info">
                <h5>${idx + 1}. ${stop.hotel}</h5>
                <p><strong>Engineers:</strong> ${stop.engineers} | <strong>Dot:</strong> ${stop.dotColour}</p>
                <p><strong>Notes:</strong> ${stop.notes}</p>
              </div>
              <div class="manifest-actions">
                <a class="action-btn btn-maps" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(stop.hotel)}" target="_blank">🗺️ Maps</a>
                <button class="action-btn btn-delete" onclick="removeStop(${stop.id})">❌</button>
              </div>
            </div>
          `;
        });
      }
      html += `<button class="btn btn-secondary" onclick="resetToHome()">Back to Add Stop</button>`;
      document.getElementById('app-container').innerHTML = html;
    }

    function removeStop(id) {
      routeManifest = routeManifest.filter(s => s.id !== id);
      localStorage.setItem('travelodge_manifest', JSON.stringify(routeManifest));
      updateManifestBadge();
      viewCurrentManifest();
    }

    function closePhotoModal() {
      document.getElementById('photo-modal').style.display = 'none';
    }
  </script>
</body>
</html>
